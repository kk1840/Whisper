// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        compileSdkVersion = 34
        minSdkVersion = 28
        targetSdkVersion = 33
        gradleVersion = '8.1.1'
        roomVersion = '2.5.0'
        okhttpVersion = '4.12.0'
        gsonVersion = '2.10.1'
        kotlinStdlibVersion = '1.9.22'
    }

    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
        maven {
            name = "NexusPublic"
            url = uri("https://nexus.zyql.com/repository/maven-public/")
        }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradleVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinStdlibVersion"
        classpath "com.stepos.unifiedsigning:unified-signing-gradle-plugin:1.0.5-alpha01-SNAPSHOT"
    }

    // 统签插件调用 ApkSigner.SignerConfig.Builder(String, KeyConfig, List, boolean)，
    // 需要 apksig >= 8.3（引入 KeyConfig）。AGP 8.1.1 自带 apksig 8.1.1 会导致 NoSuchMethodError。
    configurations.classpath {
        resolutionStrategy {
            force 'com.android.tools.build:apksig:8.3.2'
        }
    }
}

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
        maven {
            name = "NexusPublic"
            url = uri("https://nexus.zyql.com/repository/maven-public/")
        }
    }
}
